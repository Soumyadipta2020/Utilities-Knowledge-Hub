metrics:
  - name: total_visits
    description: Total number of engineer visits.
    model: visit_outcome
    type: count
    sql: job_id
    timestamp_column: visit_date
    sample_questions:
      - "What does a completed repair actually cost us to deliver?"
      - "Are our repair prices covering their cost to serve?"
      - "How much is one point of first-time fix worth in pounds?"

  - name: total_repairs
    description: Total number of completed repairs.
    model: repair_history
    type: count
    sql: job_id
    timestamp_column: repair_date
    sample_questions:
      - "What should we charge for a boiler repair?"
      - "How should repairs be priced by fault type?"
      - "Why are boiler faults rising in cold weather?"
      - "How many repair and service jobs does the plan expect each week?"
      - "Is our demand forecast accurate?"

  - name: net_appointments
    description: Weekly net completed appointments (excludes Cancelled and No Access).
    model: visit_outcome
    type: sum
    sql: CASE WHEN visit_status NOT LIKE 'Cancelled%' AND visit_status <> 'No Access' THEN 1.0 ELSE 0.0 END
    timestamp_column: visit_date


  - name: total_appointments
    description: Total number of scheduled appointments.
    model: appointment_schedule
    type: count
    sql: job_id
    timestamp_column: appointment_date
    sample_questions:
      - "Do we have enough engineer capacity in the Midlands?"
      - "When are the productive periods of our business year?"
      - "What price should we set for annual servicing and installations?"

  - name: total_quotes
    description: Total number of quotes generated.
    model: quotes_and_sales
    type: count
    sql: lead_id
    sample_questions:
      - "What is our quote-to-sale conversion rate, and does discounting improve it?"
      - "How often do we close above our opening quote, and by how much?"

  - name: total_discount
    description: Total discount amount across quotes.
    model: quotes_and_sales
    type: sum
    sql: primary_qutation - final_quotation
    sample_questions:
      - "How much are we discounting, and is it winning us any more work?"
      - "How much margin are we giving away on discounts that buy us nothing?"
  - name: total_sales
    description: Total number of closed sales from leads.
    model: installation_history
    type: sum
    sql: CASE WHEN sale_happened THEN 1 ELSE 0 END
    timestamp_column: sale_date

  - name: quote_to_sale_conversion_rate
    description: Percentage of quoted leads that resulted in a sale.
    model: installation_history
    type: avg
    sql: CASE WHEN sale_happened THEN 1.0 ELSE 0.0 END
    timestamp_column: lead_date

  - name: conversion_rate
    description: Percentage of quoted leads that resulted in a sale (alias for quote_to_sale_conversion_rate).
    model: installation_history
    type: avg
    sql: CASE WHEN sale_happened THEN 1.0 ELSE 0.0 END
    timestamp_column: lead_date

  - name: lead_to_sale_conversion_rate
    description: Percentage of quoted leads that resulted in a sale (alias for quote_to_sale_conversion_rate).
    model: installation_history
    type: avg
    sql: CASE WHEN sale_happened THEN 1.0 ELSE 0.0 END
    timestamp_column: lead_date

  - name: sales_conversion
    description: Weekly lead-to-sale conversion rate (alias for quote_to_sale_conversion_rate).
    model: installation_history
    type: avg
    sql: CASE WHEN sale_happened THEN 1.0 ELSE 0.0 END
    timestamp_column: lead_date

  - name: net_sales
    description: Weekly net sales (alias for total_sales but uses lead_date).
    model: installation_history
    type: sum
    sql: CASE WHEN sale_happened THEN 1 ELSE 0 END
    timestamp_column: lead_date

  - name: emergency_repairs
    description: Weekly emergency repair volume (alias for total_repairs).
    model: repair_history
    type: count
    sql: job_id
    timestamp_column: repair_date
