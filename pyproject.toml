[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utilities-knowledge-hub-mcp"
version = "0.1.0"
description = "Enterprise Data Platform MCP Server"
authors = [
    {name = "Enterprise Engineer"}
]
dependencies = [
    "fastmcp>=0.1.0",
    "duckdb>=1.0.0",
    "sqlglot>=23.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0"
]

[tool.setuptools.packages.find]
include = ["mcp_server*", "config*", "scripts*"]
